name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools==81.0.0"
          python -m pip install \
            "torch>=2.12,<2.13" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[api,training,agent,dev]"

      - name: Check dependency integrity
        run: python -m pip check

      - name: Audit dependencies
        run: |
          python -m pip_audit \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln GHSA-fjr4-x663-mwxc \
            --ignore-vuln GHSA-6p8h-3wgx-97gf \
            --ignore-vuln GHSA-r9mr-m37c-5fr3 \
            --ignore-vuln GHSA-94p4-4cq8-9g67

      - name: Train baseline artifacts for tests
        run: python -m phishing_ml.training.train_baseline

      - name: Evaluate baseline model
        run: python -m phishing_ml.evaluation.evaluate_baseline

      - name: Run model quality gate
        run: python -m phishing_ml.evaluation.quality_gate

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src --ignore-missing-imports

      - name: Test
        run: pytest

      - name: Validate Docker Compose config
        run: docker compose config