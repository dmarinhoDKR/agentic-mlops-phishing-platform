services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      PHISHING_ARTIFACTS_DIR: /app/artifacts/baseline
      PYTHONPATH: /app/src
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./artifacts/baseline:/app/artifacts/baseline:ro